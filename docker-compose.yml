services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: flight
      POSTGRES_PASSWORD: flight
      POSTGRES_DB: flightfinder
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flight"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7
    ports: ["6379:6379"]

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://flight:flight@postgres:5432/flightfinder?schema=public
      REDIS_URL: redis://redis:6379
      APP_ROLE: api
    command: sh -c "npx prisma migrate deploy && node dist/main.js"
    ports: ["4000:4000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }

  worker:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://flight:flight@postgres:5432/flightfinder?schema=public
      REDIS_URL: redis://redis:6379
      APP_ROLE: worker
    command: node dist/worker.js
    depends_on: [api]

  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    environment:
      API_INTERNAL_URL: http://api:4000
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  pgdata:
